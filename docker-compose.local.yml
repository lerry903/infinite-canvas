services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 8787
      DB_PATH: /data/app.sqlite
    volumes:
      - app-data:/data
    restart: unless-stopped
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      AI_BASE_URL: https://api.smartxai.cn
volumes:
  app-data:
